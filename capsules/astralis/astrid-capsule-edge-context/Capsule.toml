[package]
name = "astrid-capsule-edge-context"
version = "0.1.0"
description = "Injects read-only CPU reservoir context and the sovereign NEXT action contract"
authors = ["Unicity Labs <info@unicity-labs.com>"]
astrid-version = ">=0.5.1"

[[component]]
id = "edge-context"
file = "astrid_capsule_edge_context.wasm"
type = "executable"
capabilities = { fs_read = [
    "home://edge/runtime/spectral_state.json",
    "home://edge/perception/latest.json",
] }

[capabilities]
allow_prompt_injection = true
ipc_publish = ["prompt_builder.v1.hook_response.*"]

[env]
state_path = { type = "string", request = "Reservoir state path in the principal home VFS", default = "home://edge/runtime/spectral_state.json" }
perception_path = { type = "string", request = "Latest deterministic machine observation path", default = "home://edge/perception/latest.json" }
instance_name = { type = "string", request = "Independent appliance instance name", default = "edge Astrid" }
prompt_profile = { type = "string", request = "Prompt detail profile: detailed or compact", default = "detailed" }
inherited_corpus_present = { type = "string", request = "Whether a separate read-only inherited introspection corpus is installed", default = "true" }

[[interceptor]]
event = "prompt_builder.v1.hook.before_build"
action = "on_before_prompt_build"
