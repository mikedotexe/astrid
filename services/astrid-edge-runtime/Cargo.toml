[package]
name = "astrid-edge-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "CPU-native ESN, sensory bridge, and bounded NEXT action executor for Astrid appliances"

[workspace]

[dependencies]
anyhow = "1"
astrid-minime-protocol = { path = "../../crates/astrid-minime-protocol" }
astrid-spectral-core = { path = "../../crates/astrid-spectral-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
nalgebra = { version = "0.34.2", default-features = false, features = ["std"] }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.21"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
