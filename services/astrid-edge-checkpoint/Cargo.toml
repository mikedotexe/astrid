[package]
name = "astrid-edge-checkpoint"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Immutable CPU-edge state checkpoint and rollback-fixture verifier"

[workspace]

[dependencies]
astrid-edge-rescue-helper = { path = "../astrid-edge-rescue-helper" }
nix = { version = "0.30", default-features = false, features = ["fs", "user"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
