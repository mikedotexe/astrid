[package]
name = "astrid-edge-steward-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Immutable CPU-edge scheduled introspection and candidate intent attestor"

[workspace]

[dependencies]
ed25519-dalek = "2"
fs2 = "0.4"
nix = { version = "0.30", default-features = false, features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
socket2 = "0.6"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
