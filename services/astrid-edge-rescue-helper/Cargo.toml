[package]
name = "astrid-edge-rescue-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Immutable CPU-edge offline builder and A/B rescue helper"

[workspace]

[dependencies]
blake3 = "1"
fs2 = "0.4"
flate2 = "1"
hmac = "0.12"
nix = { version = "0.30", default-features = false, features = ["fs", "process", "signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
toml = "0.8"
tar = "0.4"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
