name: CPU Edge Astralis Capsules

on:
  pull_request:
    paths:
      - '.github/workflows/cpu-edge-astralis-capsules.yml'
      - 'packaging/headless/astralis-cpu-edge-capsules.toml'
      - 'packaging/headless/astralis-cpu-edge-baseline-capsules.toml'
      - 'packaging/headless/astralis-locks/**'
      - 'packaging/headless/astralis-sdk-0.6-*.patch'
      - 'packaging/headless/astralis-sdk-0.7-*.patch'
      - 'scripts/build_astralis_cpu_edge_capsules.py'
      - 'scripts/test_build_astralis_cpu_edge_capsules.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpu-edge-astralis-capsules.yml'
      - 'packaging/headless/astralis-cpu-edge-capsules.toml'
      - 'packaging/headless/astralis-cpu-edge-baseline-capsules.toml'
      - 'packaging/headless/astralis-locks/**'
      - 'packaging/headless/astralis-sdk-0.6-*.patch'
      - 'packaging/headless/astralis-sdk-0.7-*.patch'
      - 'scripts/build_astralis_cpu_edge_capsules.py'
      - 'scripts/test_build_astralis_cpu_edge_capsules.py'

permissions:
  contents: read

jobs:
  build:
    name: Pinned external cognition capsules
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install pinned Rust and Component Model target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.94.1'
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Offline recipe and tamper checks
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
          python3 scripts/build_astralis_cpu_edge_capsules.py --verify-only
          python3 scripts/build_astralis_cpu_edge_capsules.py \
            --spec packaging/headless/astralis-cpu-edge-baseline-capsules.toml \
            --verify-only
          python3 -m unittest scripts/test_build_astralis_cpu_edge_capsules.py
          python3 -m py_compile \
            scripts/build_astralis_cpu_edge_capsules.py \
            scripts/test_build_astralis_cpu_edge_capsules.py

      - name: Test, lint, and build pinned external capsules
        run: |
          python3 scripts/build_astralis_cpu_edge_capsules.py \
            --jobs 4 \
            --output-dir dist/astralis-cpu-edge-compat \
            --source-output-dir dist/astralis-cpu-edge-compat-source
          python3 scripts/build_astralis_cpu_edge_capsules.py \
            --spec packaging/headless/astralis-cpu-edge-baseline-capsules.toml \
            --jobs 4 \
            --output-dir dist/astralis-cpu-edge-baseline \
            --source-output-dir dist/astralis-cpu-edge-baseline-source
          mkdir -p dist/astralis-cpu-edge
          cp dist/astralis-cpu-edge-compat/*.capsule dist/astralis-cpu-edge/
          cp dist/astralis-cpu-edge-baseline/*.capsule dist/astralis-cpu-edge/
          test "$(find dist/astralis-cpu-edge -maxdepth 1 -type f -name '*.capsule' | wc -l)" -eq 10

      - name: Publish compatibility capsule evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astralis-cpu-edge-capsules
          path: dist/astralis-cpu-edge/
          if-no-files-found: error
          retention-days: 14

      - name: Publish pinned mutable source inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astralis-cpu-edge-capsule-sources
          path: |
            dist/astralis-cpu-edge-compat-source/
            dist/astralis-cpu-edge-baseline-source/
          if-no-files-found: error
          retention-days: 14
