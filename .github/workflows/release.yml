name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build binaries for each platform ──────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            # Keep the published GNU libc baseline stable for appliance hosts.
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} -p astrid

      - name: Package binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="astrid-${VERSION}-${{ matrix.target }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/astrid" "$DIR/"
          cp "target/${{ matrix.target }}/release/astrid-daemon" "$DIR/"
          cp "target/${{ matrix.target }}/release/astrid-build" "$DIR/"
          cp LICENSE* README.md "$DIR/" 2>/dev/null || true
          mkdir -p "$DIR/scripts" "$DIR/packaging/systemd" "$DIR/docs"
          cp scripts/install_headless_linux.sh scripts/probe_headless_linux.sh "$DIR/scripts/"
          cp packaging/systemd/astrid.service "$DIR/packaging/systemd/"
          cp docs/headless-linux.md "$DIR/docs/"
          (
            cd "$DIR"
            shasum -a 256 \
              astrid astrid-daemon astrid-build \
              scripts/install_headless_linux.sh scripts/probe_headless_linux.sh \
              packaging/systemd/astrid.service docs/headless-linux.md \
              > SHA256SUMS
          )
          tar czf "${DIR}.tar.gz" "$DIR"
          echo "ASSET=${DIR}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ASSET }}

  edge-appliance:
    name: CPU edge appliance (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }},wasm32-wasip2

      - name: Install Linux ARM linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: edge-${{ matrix.target }}

      - name: Build host capsule packager and target binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          ASTRID_EDGE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cargo build --release -p astrid
          cargo build --release --target "${{ matrix.target }}" -p astrid
          cargo build \
            --release \
            --target "${{ matrix.target }}" \
            --manifest-path services/astrid-edge-runtime/Cargo.toml

      - name: Build version-matched essential capsules
        run: |
          mkdir -p dist/essential
          for capsule in \
            astrid-capsule-cli \
            astrid-capsule-fs \
            astrid-capsule-http \
            astrid-capsule-shell \
            astrid-capsule-skills \
            astrid-capsule-agents \
            astrid-capsule-memory \
            astrid-capsule-edge-context \
            astrid-capsule-edge-introspector \
            astrid-capsule-edge-spectral; do
            target/release/astrid build \
              --type rust-component \
              --output dist/essential \
              "capsules/astralis/$capsule"
          done

      - name: Assemble CPU-edge archive
        run: |
          scripts/package_edge_appliance.sh \
            --version "${GITHUB_REF_NAME#v}" \
            --target "${{ matrix.target }}" \
            --core-binary-dir "target/${{ matrix.target }}/release" \
            --edge-binary "services/astrid-edge-runtime/target/${{ matrix.target }}/release/astrid-edge-runtime" \
            --capsule-dir dist/essential \
            --output-dir dist
          asset="dist/astrid-cpu-edge-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz"
          test -f "$asset"
          test -f "${asset}.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Verify release packaging and archive inventory
        run: |
          scripts/test_package_edge_appliance.sh
          sha256sum -c "${ASSET}.sha256"
          verify_root="$(mktemp -d)"
          trap 'rm -rf -- "$verify_root"' EXIT
          tar -C "$verify_root" -xzf "$ASSET"
          bundle="$verify_root/astrid-cpu-edge-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          test -d "$bundle"
          (
            cd "$bundle"
            sha256sum -c SHA256SUMS
          )
          python3 - \
            "$bundle/BUILD-MANIFEST.json" \
            "${{ matrix.target }}" \
            "${GITHUB_REF_NAME#v}" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert manifest["schema"] == "astrid_cpu_edge_build_manifest_v2"
          assert manifest["bundle_format"] == "cpu-edge.2"
          assert manifest["target"] == sys.argv[2]
          assert manifest["version"] == sys.argv[3]
          assert manifest["binary_architecture_verified"] is True
          assert manifest["essential_capsule_count"] == 10
          assert manifest["expected_loaded_capsule_count"] == 20
          assert manifest["incremental_installed_code_bytes"] <= 20 * 1024 * 1024
          PY
          test "$(find "$bundle/capsules" -maxdepth 1 -type f -name '*.capsule' | wc -l)" -eq 10
          systemd-analyze verify \
            "$bundle"/packaging/systemd/*.service \
            "$bundle"/packaging/systemd/*.timer
          systemd-analyze verify \
            "$bundle"/packaging/systemd/icp/*.service \
            "$bundle"/packaging/systemd/icp/*.timer

      - name: Upload CPU-edge archive
        uses: actions/upload-artifact@v4
        with:
          name: edge-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  # ── Create the GitHub release with all binaries ───────────────────
  github-release:
    name: GitHub Release
    needs: [build, edge-appliance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](https://github.com/unicity-astrid/astrid/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for details."
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile Astrinauts for this release
        id: contributors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            AUTHORS=$(git log --format='%aN' | sort -u)
          else
            AUTHORS=$(git log --format='%aN' "$PREV_TAG"..HEAD | sort -u)
          fi
          ASTRINAUTS=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            EMAIL=$(git log --format='%aE' --author="$name" -1)
            USERNAME=$(gh api "search/users?q=$EMAIL+in:email" --jq '.items[0].login // empty' 2>/dev/null || true)
            if [ -n "$USERNAME" ]; then
              ASTRINAUTS="${ASTRINAUTS}\n- @${USERNAME}"
            else
              ASTRINAUTS="${ASTRINAUTS}\n- ${name}"
            fi
          done <<< "$AUTHORS"
          {
            echo "list<<EOF"
            echo -e "$ASTRINAUTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          body: |
            ${{ steps.changelog.outputs.body }}

            ## Install

            **From source (requires Rust 1.94+):**
            ```
            cargo install astrid
            ```

            **Pre-built binaries:**
            Download the archive for your platform, extract, and add to PATH:
            ```
            tar xzf astrid-*-$(uname -m)-*.tar.gz
            sudo mv astrid-*/astrid astrid-*/astrid-daemon astrid-*/astrid-build /usr/local/bin/
            ```

            Then run `astrid init` to set up capsules.

            ---

            **With many thanks from the following Astrinauts** 🚀
            ${{ steps.contributors.outputs.list }}

      - name: Notify Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          gh api repos/unicity-astrid/homebrew-tap/dispatches \
            -f event_type=release \
            -f "client_payload[version]=${GITHUB_REF_NAME#v}"
