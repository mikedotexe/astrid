[Unit]
# Never start the ICP Astrid stack against the eMMC path if the SSD failed to
# mount. The system fstab entry is responsible for mounting /media/data before
# the lingering user manager begins the normal default target.
ConditionPathIsMountPoint=/media/data
ConditionPathIsSymbolicLink=%h/.astrid-icp
ConditionPathIsDirectory=%h/.astrid-icp/state

[Service]
# Follow the link and require the exact SSD root inode. This prevents a later
# retarget to some other directory from passing merely because /media/data is
# mounted.
ExecCondition=/usr/bin/test %h/.astrid-icp -ef /media/data/astrid
