[Service]
# The verifier lives on eMMC, waits through a bounded mount race, pins the SSD
# UUID/filesystem/options, and revalidates the exact symlink and inode before
# every start. In condition mode a transient timeout becomes exit 255, which
# fails and retries the unit; an identity/policy mismatch remains exit 78,
# which systemd treats as a permanent clean skip.
# Environment files cannot redirect the production verifier. UnsetEnvironment
# is applied after all Environment=/EnvironmentFile= sources are merged.
UnsetEnvironment=ASTRID_ICP_SSD_GUARD_TEST_MODE ASTRID_ICP_SSD_GUARD_MOUNT_PATH ASTRID_ICP_SSD_GUARD_EXPECTED_UUID ASTRID_ICP_SSD_GUARD_ROOT_PATH ASTRID_ICP_SSD_GUARD_LINK_PATH ASTRID_ICP_SSD_GUARD_STATE_PATH ASTRID_ICP_SSD_GUARD_STATE_BIN_PATH ASTRID_ICP_SSD_GUARD_STATE_RUN_PATH ASTRID_ICP_SSD_GUARD_STATE_VAR_PATH ASTRID_ICP_SSD_GUARD_STATE_HOME_PATH ASTRID_ICP_SSD_GUARD_STATE_DEFAULT_PATH ASTRID_ICP_SSD_GUARD_EDGE_WORKSPACE_PATH ASTRID_ICP_SSD_GUARD_WORKSPACE_PATH ASTRID_ICP_SSD_GUARD_TMP_PATH ASTRID_ICP_SSD_GUARD_OLLAMA_PATH ASTRID_ICP_SSD_GUARD_OLLAMA_RUNTIME_PATH ASTRID_ICP_SSD_GUARD_OLLAMA_RUNTIME_BIN_PATH ASTRID_ICP_SSD_GUARD_OLLAMA_MODELS_PATH ASTRID_ICP_SSD_GUARD_FINDMNT ASTRID_ICP_SSD_GUARD_READLINK ASTRID_ICP_SSD_GUARD_SLEEP
ExecCondition=%h/.local/libexec/astrid/wait-for-icp-ssd --systemd-condition --wait-seconds 75 --poll-seconds 2
TimeoutStartSec=780
