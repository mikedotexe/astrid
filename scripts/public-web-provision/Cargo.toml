[package]
name = "astrid-public-web-provision"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
astrid-capabilities = { path = "../../crates/astrid-capabilities" }
astrid-core = { path = "../../crates/astrid-core" }
astrid-crypto = { path = "../../crates/astrid-crypto" }
astrid-minime-protocol = { path = "../../crates/astrid-minime-protocol" }
astrid-public-web = { path = "../../crates/astrid-public-web" }
chrono = "=0.4.45"
clap = { version = "=4.6.6", features = ["derive"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
